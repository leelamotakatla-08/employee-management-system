# ==========================================================
# Application Configuration
# ==========================================================
spring.application.name=employee-management-system

# ==========================================================
# MySQL Database Configuration
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=LEELA@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / Hibernate Configuration
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================================
# JWT Configuration
# ==========================================================
jwt.secret=YourSuperSecretKeyForJwtAuthentication123456789
jwt.expiration=86400000

# ==========================================================
# Server Configuration
# ==========================================================
server.port=8080

# ==========================================================
# Logging Configuration
# ==========================================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ==========================================================
# Jackson Configuration
# ==========================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================================
# Spring Banner
# ==========================================================
spring.main.banner-mode=console